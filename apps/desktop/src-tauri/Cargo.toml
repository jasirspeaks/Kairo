[package]
name = "kairo-desktop"
version = "0.1.0"
description = "Kairo Deal Intelligence Co-pilot Desktop App"
authors = ["Kairo Team"]
edition = "2021"

[lib]
name = "kairo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
